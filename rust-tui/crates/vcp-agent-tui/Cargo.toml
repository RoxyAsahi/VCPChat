[package]
name = "vcp-agent-tui"
version = "0.1.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
description = "VCPAgent Rust TUI, adapted from Grok Build UI primitives"
workspace = "../../../rust"

[dependencies]
anstyle = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
unicode-width = { workspace = true }
rpassword = { workspace = true }
xai-ratatui-textarea = { path = "../../third_party/xai-ratatui-textarea" }
vcp-agent-host = { path = "../../../rust/crates/vcp-agent-host" }
vcp-grok-crash-handler = { path = "../../../rust/crates/vcp-grok-crash-handler" }
vcp-grok-markdown = { path = "../../../rust/crates/vcp-grok-markdown" }
wait-timeout = { workspace = true }

[dev-dependencies]
vcp-agent-pty-harness = { path = "../vcp-agent-pty-harness" }

[[bin]]
name = "vcp-agent"
path = "src/main.rs"
