[package]
name = "vcp-agent-vcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Future Rust TUI / standalone host only. The current daemon relies on the JS
# Host, so its normal build does not pull an HTTP or WebSocket stack.
direct-host = ["dep:futures-util", "dep:reqwest", "dep:tokio-tungstenite", "dep:url"]

[dependencies]
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }
vcp-agent-protocol = { path = "../vcp-agent-protocol" }
