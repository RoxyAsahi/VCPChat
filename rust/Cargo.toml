[workspace]
resolver = "2"
members = [
    "crates/vcp-agent-protocol",
    "crates/vcp-agent-core",
    "crates/vcp-agent-vcp",
    "crates/vcp-agent-host",
    "crates/vcp-agentd",
    "crates/vcp-grok-compaction",
    "crates/vcp-grok-interjection",
    "crates/vcp-grok-prompt-queue",
    "../rust-tui/crates/vcp-agent-tui",
    "../rust-tui/third_party/xai-ratatui-textarea",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC-BY-NC-SA-4.0"
authors = ["VCP Project"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
ratatui = { version = "0.29", features = ["crossterm", "unstable-widget-ref"] }
ratatui-core = "0.1"
textwrap = "0.16"
tui-scrollbar = "0.2"
unicode-segmentation = "1.12"
unicode-width = "0.2"
rpassword = "7"
