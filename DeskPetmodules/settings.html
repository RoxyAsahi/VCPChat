<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src vcp-deskpet:; style-src vcp-deskpet:; img-src data:">
  <title>桌宠设置</title>
  <link rel="stylesheet" href="vcp-deskpet://pet/app/settings.css">
</head>
<body>
  <main>
    <h1>桌宠设置</h1>

    <section>
      <label class="row switch">
        <span class="text">
          <span class="title">免打扰</span>
          <span class="hint">不主动说话、不出声，主窗口里聊天的回复也不在桌宠头上冒出来。在桌宠上跟 TA 说的话照常回。</span>
        </span>
        <input type="checkbox" id="doNotDisturb">
      </label>
      <label class="row switch">
        <span class="text">
          <span class="title">启动时恢复桌宠</span>
          <span class="hint">打开 VCPChat 时，把上次开着的桌宠放回原来的位置。</span>
        </span>
        <input type="checkbox" id="restoreOnLaunch">
      </label>
    </section>

    <h2>形象和大小</h2>
    <section id="sizes">
      <p class="empty" id="sizesEmpty">现在没有开着的桌宠。在聊天头部点爪印按钮打开一个。</p>
      <div id="sizeList"></div>
      <p class="hint footnote" id="wheelHint"></p>
    </section>

    <h2>快捷键</h2>
    <section>
      <p class="hint footnote" id="shortcutHint">在任何程序里都能用。点一下按钮，再按下想要的组合键；Esc 取消，Backspace 清除。</p>
      <div id="shortcutList"></div>
      <div class="actions">
        <button type="button" id="resetShortcuts">恢复默认快捷键</button>
      </div>
    </section>
  </main>
  <script type="module" src="vcp-deskpet://pet/app/settings.js"></script>
</body>
</html>
